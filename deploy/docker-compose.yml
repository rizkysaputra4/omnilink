version: '3.8'

services:
  omnilink-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - OMNILINK_BIND=0.0.0.0:8080
      - RUST_LOG=info
    expose:
      - "8080"
    networks:
      - omnilink-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - RELAY_DOMAIN=${RELAY_DOMAIN:-relay.findbeatradar.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - omnilink-relay
    networks:
      - omnilink-net

networks:
  omnilink-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
